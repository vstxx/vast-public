name: Video & Audio module release candidate

# Builds the downloadable Video & Audio module (PyInstaller service, Playwright
# Chromium, audited FFmpeg/FFprobe) from resources/avidae/module.json, signs its
# release manifest with the protected module signing key, verifies it against
# the keys pinned in Vast, and stores everything in a private draft release.
# Publishing the draft and pointing the module channel manifest at it are
# deliberate manual steps (docs/AVIDAE_MODULE.md).

on:
  workflow_dispatch:
    inputs:
      module_version:
        description: Exact module version from resources/avidae/module.json
        required: true
        type: string
      key_id:
        description: Pinned signing key id (src/shared/avidae-module-policy.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: avidae-module-release
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: windows-latest
    timeout-minutes: 240
    environment: public-release
    env:
      MODULE_TAG: avidae-module-v${{ inputs.module_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail early when inputs, pins or secrets are missing
        shell: pwsh
        env:
          VAST_AVIDAE_MODULE_SIGNING_KEY: ${{ secrets.VAST_AVIDAE_MODULE_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.VAST_RELEASE_TOKEN }}
        run: |
          $module = Get-Content -Raw resources/avidae/module.json | ConvertFrom-Json
          if ($module.moduleVersion -cne '${{ inputs.module_version }}') { throw "resources/avidae/module.json is $($module.moduleVersion), not ${{ inputs.module_version }}." }
          $policy = Get-Content -Raw src/shared/avidae-module-policy.json | ConvertFrom-Json
          if (-not ($policy.trustedKeys | Where-Object { $_.keyId -ceq '${{ inputs.key_id }}' -and $_.status -eq 'current' })) { throw 'The signing key id is not pinned as current in Vast.' }
          if (-not $env:VAST_AVIDAE_MODULE_SIGNING_KEY) { throw 'VAST_AVIDAE_MODULE_SIGNING_KEY is not configured.' }
          if (-not $env:GH_TOKEN) { throw 'VAST_RELEASE_TOKEN is not configured.' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r resources/avidae/requirements.txt -r resources/avidae/requirements-build.txt
      - name: Restore or build pinned Vast FFmpeg with corresponding source
        uses: ./.github/actions/prepare-ffmpeg
        with:
          github-token: ${{ github.token }}
      - run: python -m unittest tests/avidae/avidae_security_test.py
      - name: Prepare and self-test the Video & Audio runtime
        run: npm run avidae:runtime:prepare
      - name: Build module archive
        run: npm run avidae:module:build -- --base-url "https://github.com/vstxx/vast-public/releases/download/${{ env.MODULE_TAG }}"
      - name: Sign release manifest with the pinned key
        env:
          VAST_AVIDAE_MODULE_SIGNING_KEY: ${{ secrets.VAST_AVIDAE_MODULE_SIGNING_KEY }}
        run: npm run avidae:module:sign -- --dir "release/avidae-module/${{ inputs.module_version }}" --key-id "${{ inputs.key_id }}"
      - name: Verify signature, extraction, self-test, licenses and corresponding source
        run: npm run avidae:module:verify -- --dir "release/avidae-module/${{ inputs.module_version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: avidae-module-${{ inputs.module_version }}
          path: release/avidae-module/${{ inputs.module_version }}/
          retention-days: 14
      - name: Create private draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.VAST_RELEASE_TOKEN }}
        run: |
          $dir = "release/avidae-module/${{ inputs.module_version }}"
          $assets = @('avidae-module.json', 'SHA256SUMS.txt', "VastVideoAudio-${{ inputs.module_version }}-win-x64.tar.zst", 'ffmpeg-corresponding-source-win64.tar.zst') | ForEach-Object { Join-Path $dir $_ }
          gh release create $env:MODULE_TAG --repo vstxx/vast-public --draft --title "Vast Video & Audio module ${{ inputs.module_version }}" --notes "Signed Video & Audio module ${{ inputs.module_version }} for Vast. Includes FFmpeg corresponding source." @assets
