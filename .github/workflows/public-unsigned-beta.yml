name: Public unsigned release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact package version to publish as an unsigned release
        required: true
        default: 0.2.7
        type: string
      channel:
        description: Public distribution channel
        required: true
        default: stable
        type: choice
        options: [beta, stable]
      risk_ack:
        description: Type I_ACCEPT_UNSIGNED_PUBLIC_RELEASE_RISK
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  build-verify-publish:
    runs-on: windows-latest
    timeout-minutes: 240
    environment: public-release
    env:
      VAST_RELEASE_CHANNEL: ${{ inputs.channel }}
      VAST_PRIVATE_BUILD: '0'
      VAST_PUBLIC_UNSIGNED_RELEASE: '1'
      VAST_UNSIGNED_RELEASE_ACK: ${{ inputs.risk_ack }}
      VAST_RELEASE_REPO: vstxx/vast-public
      VAST_PREVIOUS_VERSION: 0.2.5
      VAST_PREVIOUS_RELEASE_BASE_URL: https://github.com/vstxx/vast-public/releases/download/v0.2.5
      VAST_PREVIOUS_SIGNATURE_POLICY: unsigned
      VAST_CURRENT_SIGNATURE_POLICY: unsigned
      VAST_UPDATE_ENABLED: '1'
      VAST_OBFUSCATE: '1'
      VAST_RELAY_ENABLED: '1'
      VAST_RELAY_ENVIRONMENT: production
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.VAST_RELEASE_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail fast when unsigned-release credentials are unavailable
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $required = @{
            VAST_RELEASE_TOKEN = $env:GH_TOKEN
            CLOUDFLARE_API_TOKEN = $env:CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID = $env:CLOUDFLARE_ACCOUNT_ID
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace([string] $_.Value) } | ForEach-Object Key | Sort-Object)
          if ($missing.Count -gt 0) {
            throw "Unsigned public release prerequisites are missing: $($missing -join ', '). Configure the protected public-release environment before running expensive package stages."
          }
          gh auth setup-git --hostname github.com
          $pushPermission = gh api repos/vstxx/vast-public --jq .permissions.push 2>$null
          if ($LASTEXITCODE -ne 0 -or [string]$pushPermission -ne 'true') {
            throw 'VAST_RELEASE_TOKEN must grant push (write) access to vstxx/vast-public for the source snapshot and tag publication.'
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relay/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate explicit unsigned-release authorization and exact source
        shell: pwsh
        run: |
          if ('${{ inputs.risk_ack }}' -ne 'I_ACCEPT_UNSIGNED_PUBLIC_RELEASE_RISK') { throw 'Exact unsigned-release risk acknowledgement is required.' }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($version -ne '${{ inputs.expected_version }}') { throw "package.json version $version does not match the authorized version." }
          git diff --exit-code
          git diff --cached --exit-code
          $head = git rev-parse HEAD
          if ($head -ne '${{ github.sha }}') { throw "Checked out $head instead of workflow SHA ${{ github.sha }}." }
          if (git tag --list "v$version") { throw "Tag v$version already exists and immutable unsigned artifacts must not be replaced." }
          "VAST_RELEASE_COMMIT=$head" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install exact dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm ci --prefix relay
          python -m pip install -r resources/avidae/requirements.txt -r resources/avidae/requirements-build.txt
      - name: Restore or build pinned Vast FFmpeg with corresponding source
        uses: ./.github/actions/prepare-ffmpeg
        with:
          github-token: ${{ github.token }}

      - name: Full quality and dependency gate
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run audit:ci
          npm run lint
          npm run check --prefix relay
          npm test
          npm run hub:typecheck
          npm run hub:test
          npm run hub:build
          npm run build:signer --prefix extensions-hub
          npm run test:extensions:e2e
          npm run test:extensions:native-e2e
          npm run updater:stage
          npm run test:updater
          npm run release:audit
          npm run release:check
          npm run test:fuses:integration
          npm run test:electron-version
          npm run test:app
      - name: Verify production Relay writes the release check-in
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run verify:release-checkin --prefix relay
      - name: Verify production Extensions Hub trust compatibility
        run: npm run hub:verify:production
      - name: Prepare self-contained Video & Audio runtime
        run: npm run avidae:runtime:prepare
      - name: Build explicitly unsigned public release
        run: npm run dist:upgrader
      - name: Verify provenance, hashes, fuses, resources, and intentional NotSigned status
        run: node scripts/verify-release-package.cjs
      - name: Verify clean Windows install, registration and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-clean-uninstall.test.ps1 -InstallerPath "release/Installer/Vast-Setup-$version.exe"
      - name: Verify real public 0.2.5 to local candidate upgrade
        shell: pwsh
        run: |
          $env:VAST_CURRENT_RELEASE_ROOT = (Resolve-Path release).Path
          $env:VAST_RELEASE_VERSION = (Get-Content -Raw package.json | ConvertFrom-Json).version
          npm run test:upgrade:public

      - name: Preserve verified release candidate for manual publication resume
        uses: actions/upload-artifact@v4
        with:
          name: vast-public-unsigned-${{ inputs.channel }}-${{ github.sha }}-release-candidate
          path: |
            release/Installer/
            release/Updater/
            release/Downloads/
            release/Checksums/
            release/Docs/
            release/Source/
            release/version.json
            release/PUBLIC-UNSIGNED-RELEASE.md
            out/release-build-metadata.json
          if-no-files-found: error

      - name: Publish matching public source snapshot and immutable tag
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $snapshot = Join-Path $env:RUNNER_TEMP 'vast-public-source'
          $publicRepo = Join-Path $env:RUNNER_TEMP 'vast-public-repo'
          node scripts/export-public-source-snapshot.mjs --output $snapshot
          gh repo clone vstxx/vast-public $publicRepo
          git -C $publicRepo rm -r --ignore-unmatch .
          Get-ChildItem -LiteralPath $snapshot -Force | Copy-Item -Destination $publicRepo -Recurse -Force
          git -C $publicRepo add -A
          git -C $publicRepo config user.name 'Vast Release Bot'
          git -C $publicRepo config user.email 'release@vastbrowser.com'
          git -C $publicRepo commit -m "Publish Vast $version source snapshot ($env:VAST_RELEASE_COMMIT)"
          git -C $publicRepo tag -a "v$version" -m "Vast $version from $env:VAST_RELEASE_COMMIT"
          git -C $publicRepo push origin HEAD:main "refs/tags/v$version"

      - name: Create draft release and upload immutable assets
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $notes = Join-Path $env:RUNNER_TEMP 'vast-unsigned-release-notes.md'
          @(
            "# Vast $version — PUBLIC UNSIGNED RELEASE",
            "",
            "**Warning: Windows will show Unknown publisher and SmartScreen may warn.**",
            "",
            "This release is intentionally not Authenticode-signed and has no trusted timestamp.",
            "Source commit: $env:VAST_RELEASE_COMMIT",
            "Verify SHA-256/SHA-512 before running. Download only from the official Vast website or this repository.",
            "A future signed release will use a newer version; these assets are immutable."
          ) | Set-Content -LiteralPath $notes -Encoding utf8
          $flags = @('--repo', 'vstxx/vast-public', '--title', "Vast $version — Public Unsigned Release", '--notes-file', $notes, '--draft')
          if ('${{ inputs.channel }}' -eq 'beta') { $flags += '--prerelease' }
          gh release create "v$version" @flags
          $assets = @(
            "release/Installer/Vast-Setup-$version.exe",
            "release/Installer/Vast-Setup-$version.exe.blockmap",
            "release/Installer/Vast-$version-Portable.exe",
            'release/Installer/latest.yml',
            "release/Updater/VastUpdater-$version.exe",
            'release/Downloads/update-manifest.json',
            "release/Downloads/Vast-$version-update.zip",
            'release/Checksums/checksums.json',
            'release/Checksums/SHA256SUMS.txt',
            'release/Checksums/SHA512SUMS.txt',
            'release/Docs/release-manifest.json',
            'release/Docs/ffmpeg-build-provenance.json',
            'release/Docs/avidae-ffmpeg-capabilities.json',
            'release/Source/ffmpeg-corresponding-source-win64.tar.zst',
            'release/version.json',
            'release/PUBLIC-UNSIGNED-RELEASE.md'
          )
          gh release upload "v$version" @assets --repo vstxx/vast-public
      - name: Re-download and verify draft assets
        env:
          VAST_GITHUB_DRAFT_RELEASE: '1'
        run: npm run release:verify:published
      - name: Publish verified unsigned release
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $flags = @('--repo', 'vstxx/vast-public', '--draft=false')
          if ('${{ inputs.channel }}' -eq 'beta') { $flags += '--prerelease' }
          gh release edit "v$version" @flags
      - name: Re-download and verify public production URLs
        run: npm run release:verify:published

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vast-public-unsigned-${{ inputs.channel }}-${{ github.sha }}-verification
          path: |
            release/PUBLIC-UNSIGNED-RELEASE.md
            release/version.json
            release/Checksums/
            release/Docs/release-manifest.json
            release/Docs/ffmpeg-build-provenance.json
            release/Docs/avidae-ffmpeg-capabilities.json
            release/Source/ffmpeg-corresponding-source-win64.tar.zst
            out/release-build-metadata.json
          if-no-files-found: warn
