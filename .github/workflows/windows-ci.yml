name: Windows CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Full history secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/setup-gitleaks.cjs
      - run: node scripts/secret-scan.cjs

  validate:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VAST_RELEASE_CHANNEL: dev
      VAST_PRIVATE_BUILD: '1'
      VAST_RELAY_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install Vast Relay dependencies
        run: npm ci --prefix relay
      - name: Reject high or critical npm vulnerabilities
        run: npm run audit:ci
      - name: Ensure Electron runtime is installed
        shell: pwsh
        run: |
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          node node_modules/electron/install.js
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            throw 'Electron runtime installation did not produce electron.exe.'
          }
      - run: python -m pip install -r resources/avidae/requirements.txt -r resources/avidae/requirements-build.txt
      - name: Restore or build audited FFmpeg and complete corresponding source
        uses: ./.github/actions/prepare-ffmpeg
        with:
          github-token: ${{ github.token }}
      - name: Prepare and verify self-contained Video & Audio runtime
        run: npm run avidae:runtime:prepare
      - run: npm run lint
      - run: python -m unittest tests/avidae/avidae_security_test.py
      - name: Validate Vast Relay Workers
        run: npm run check --prefix relay
      - run: npm test
      - run: npm run hub:typecheck
      - run: npm run hub:test
      - run: npm run hub:build
      - run: npm run test:extensions:e2e
      - run: npm run test:extensions:native-e2e
      - run: npm run build
      - name: Verify tab overflow and browser context menu actions
        run: node scripts/menus-e2e.cjs
      - run: npm run test:app
      - run: npm run updater:stage
      - run: npm run test:updater
      - name: Exercise real background update downloads and cache recovery
        run: node scripts/run-updater-download-e2e.cjs
      - run: npm run release:audit
      - run: npm run release:version-check
      - run: npm run release:check
      - run: npm run test:fuses:integration
      - run: npm run test:electron-version
      - run: npm run test:store
      - name: Build unsigned NSIS installer with the production include
        env:
          VAST_RELEASE_CHANNEL: stable
          VAST_PRIVATE_BUILD: '0'
          VAST_PUBLIC_UNSIGNED_RELEASE: '1'
          VAST_UNSIGNED_RELEASE_ACK: I_ACCEPT_UNSIGNED_PUBLIC_RELEASE_RISK
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never --win nsis --x64 --config scripts/electron-builder-public-unsigned-release.cjs
      - name: Verify real NSIS install, PDF registration and clean uninstall
        shell: pwsh
        env:
          VAST_PUBLIC_UNSIGNED_RELEASE: '1'
          VAST_UNSIGNED_RELEASE_ACK: I_ACCEPT_UNSIGNED_PUBLIC_RELEASE_RISK
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-clean-uninstall.test.ps1 -InstallerPath "release/Vast-Setup-$version.exe"
      - name: Smoke packaged application
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $exe = Resolve-Path 'release/win-unpacked/Vast.exe'
          $profile = Join-Path $env:RUNNER_TEMP 'vast-packaged-smoke'
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/store/packaged-launch-health.test.ps1 -ExecutablePath $exe -ProfileRoot $profile
      - name: Verify packaged application resources and fuses
        if: github.event_name != 'pull_request'
        run: npm run test:package:ci
      - name: Build and verify native development Store MSIX
        if: github.event_name != 'pull_request'
        run: npm run dist:store:dev
      - name: Verify Store install, launch, upgrade and clean uninstall
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $storeVersion = node -p "require('./scripts/store-msix-config.cjs').storePackageVersion()"
          $package = Resolve-Path "release/store/Vast-$version-Store-$storeVersion-x64-Development.msix"
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/store/store-msix-upgrade.test.ps1 -PackagePath $package
