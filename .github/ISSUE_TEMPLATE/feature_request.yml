name: Feature request
description: Suggest a focused improvement to Vast Browser
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow or limitation first, rather than only the proposed UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or trade-offs
      description: Optional. Mention existing Vast features or simpler approaches that come close.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tabs / workspaces
        - Browser UI / customization
        - Privacy / site controls
        - Extensions
        - Performance / memory
        - Downloads / files
        - Data / backup / migration
        - Labs
        - Other
    validations:
      required: true
