<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vast Cat Animation Studio</title>
  <style>
    :root { color-scheme: dark; font: 14px/1.4 Inter, system-ui, sans-serif; background: #101116; color: #f4f3f7; }
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: 310px 1fr; height: 100vh; }
    aside { padding: 18px; border-right: 1px solid #302c3a; overflow: auto; background: #15151b; }
    h1 { margin: 0 0 4px; font-size: 18px; }
    .muted { color: #a8a4b1; font-size: 12px; }
    label { display: grid; gap: 5px; margin-top: 14px; color: #cbc7d1; }
    select, button { border: 1px solid #494254; border-radius: 8px; background: #212029; color: inherit; padding: 8px 10px; }
    button { cursor: pointer; }
    button:hover { border-color: #9066bf; }
    .row { display: flex; gap: 7px; margin-top: 10px; flex-wrap: wrap; }
    .toggle { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
    .toggle input { accent-color: #9b66d0; }
    main { display: grid; grid-template-rows: 1fr auto; min-width: 0; }
    #stage { position: relative; overflow: hidden; background: #1d1c22; }
    #stage.light { background: #f4f1ec; }
    #stage.clipped::after { content: ''; position: absolute; left: calc(50% - 90px); top: calc(50% - 25px); width: 180px; height: 50px; border: 1px solid #9b66d0; box-shadow: 0 0 0 9999px rgb(9 9 12 / .54); pointer-events: none; }
    #bounds { position: absolute; left: 50%; top: 50%; border: 1px solid #eb5d75; transform: translate(-50%, -50%); }
    #sprite { width: 32px; height: 32px; background-repeat: no-repeat; image-rendering: pixelated; image-rendering: crisp-edges; transform-origin: center bottom; }
    #baseline { position: absolute; left: 0; right: 0; height: 1px; background: #59d6ba; pointer-events: none; }
    #anchor { position: absolute; width: 7px; height: 7px; border: 1px solid #ffd166; transform: translate(-50%, -50%); pointer-events: none; }
    #stage:not(.guides) #bounds, #stage:not(.guides) #baseline, #stage:not(.guides) #anchor { display: none; }
    footer { padding: 12px 16px; border-top: 1px solid #302c3a; background: #15151b; font-family: ui-monospace, monospace; color: #c8c4ce; }
    #scene-rail { position: absolute; left: 10%; right: 10%; top: 54%; height: 48px; border: 1px solid rgb(155 102 208 / .55); border-radius: 14px; }
    #scene-label { position: absolute; left: 12px; top: 10px; color: #8f8997; font-size: 12px; }
  </style>
</head>
<body>
  <aside>
    <h1>Cat Animation Studio</h1>
    <div class="muted">Development-only · Cat_Grey_White · all source tags</div>
    <label>Animation tag<select id="animation"></select></label>
    <label>Final Vast scene<select id="scene">
      <option value="none">None</option><option>Omnibox peek</option><option>Omnibox swat</option>
      <option>Tab walk</option><option>Tab climb</option><option>Closing-tab scratch</option>
      <option>Idle / dream</option><option>Secret: vast cat</option>
    </select></label>
    <div class="row"><button id="play">Pause</button><button id="previous">◀ Frame</button><button id="next">Frame ▶</button><button id="cancel">Cancel</button></div>
    <label>Integer scale<select id="scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label>
    <label>Background<select id="background"><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <label>Facing<select id="facing"><option value="right">Right</option><option value="left">Left</option></select></label>
    <label class="toggle"><input id="guides" type="checkbox" checked> Bounds, baseline and anchor</label>
    <label class="toggle"><input id="clipping" type="checkbox"> Clipping test</label>
    <p class="muted">Frames use their actual Aseprite duration. The source atlas is generated with nearest-neighbor pixels and is never bundled into production.</p>
  </aside>
  <main>
    <div id="stage" class="guides"><div id="scene-label">Raw animation preview</div><div id="scene-rail"></div><div id="bounds"><div id="sprite"></div><div id="baseline"></div><div id="anchor"></div></div></div>
    <footer id="status">Loading generated metadata…</footer>
  </main>
  <script>
    const $ = (id) => document.getElementById(id)
    const stage = $('stage'), sprite = $('sprite'), bounds = $('bounds'), status = $('status')
    let data, tag, frameCursor = 0, playing = true, timer, generation = 0, sceneGeneration = 0
    const sceneSequences = {
      'Omnibox peek': ['Spawn_1', 'Sit_Lift_1', 'Sit_Tilt_1', 'Sit_Lift_1'],
      'Omnibox swat': ['Idle_Lift_1', 'Attack_1', 'Pull_Back', 'Idle_Yes'],
      'Tab walk': ['Spawn_1', 'Run_1', 'Stop_1', 'Idle_Tilt_1'],
      'Tab climb': ['Climb_1', 'Climb_2', 'Climb_3', 'Climb_Jump_1', 'Sit_Tilt_1', 'Climb_Jump_2'],
      'Closing-tab scratch': ['Scratching_Start', 'Scratching_1', 'Scratching_End', 'Sit_No'],
      'Idle / dream': ['W_1', 'SIt_Down', 'Rest_1', 'Rest_2', 'Dream', 'Rest_4', 'Stand_Up', 'W_1'],
      'Secret: vast cat': ['Spawn_2', 'Climb_2', 'W_1', 'Attack_1', 'Dance', 'Jump_1']
    }

    function frameOrder(selected) {
      const frames = [...selected.frames]
      if (selected.direction === 'reverse') frames.reverse()
      if (selected.direction === 'ping-pong') frames.push(...frames.slice(1, -1).reverse())
      if (selected.direction === 'ping-pong-reverse') return frames.reverse().concat(frames.slice(1, -1))
      return frames
    }
    function render() {
      const frames = frameOrder(tag), frame = frames[frameCursor % frames.length]
      const scale = Number($('scale').value), atlas = data.atlas
      bounds.style.width = bounds.style.height = `${atlas.frame_width * scale}px`
      sprite.style.width = sprite.style.height = `${atlas.frame_width * scale}px`
      sprite.style.backgroundSize = `${atlas.width * scale}px ${atlas.height * scale}px`
      sprite.style.backgroundPosition = `${-frame.x * scale}px ${-frame.y * scale}px`
      sprite.style.transform = `scaleX(${$('facing').value === 'left' ? -1 : 1})`
      $('baseline').style.top = `${31 * scale}px`
      $('anchor').style.left = `${16 * scale}px`; $('anchor').style.top = `${31 * scale}px`
      status.textContent = `${tag.name} · frame ${frameCursor + 1}/${frames.length} · source #${frame.index} · ${frame.duration_ms} ms · ${tag.direction} · ${tag.total_duration_ms} ms total`
      return frame.duration_ms
    }
    function arm() {
      clearTimeout(timer)
      const duration = render()
      if (!playing) return
      const activeGeneration = generation
      timer = setTimeout(() => { if (activeGeneration !== generation) return; frameCursor = (frameCursor + 1) % frameOrder(tag).length; arm() }, duration)
    }
    function selectTag(name) { tag = data.tags.find((item) => item.name === name) || data.tags[0]; frameCursor = 0; generation++; arm() }
    function delay(ms) { return new Promise((resolve) => setTimeout(resolve, ms)) }
    async function runScene(name) {
      const sequence = sceneSequences[name]
      const activeScene = ++sceneGeneration
      if (!sequence) return
      playing = true; $('play').textContent = 'Pause'
      for (let index = 0; index < sequence.length; index++) {
        if (activeScene !== sceneGeneration) return
        $('animation').value = sequence[index]
        selectTag(sequence[index])
        const progress = sequence.length === 1 ? 0.5 : index / (sequence.length - 1)
        bounds.style.left = `${22 + progress * 56}%`
        bounds.style.top = name === 'Tab climb' ? `${76 - progress * 40}%` : '50%'
        bounds.style.transition = 'left 320ms linear, top 320ms linear'
        await delay(tag.total_duration_ms)
      }
      bounds.style.transition = ''; bounds.style.left = '50%'; bounds.style.top = '50%'
    }
    Promise.all([
      fetch('/assets/cat-addon/generated/source-tags.json').then((response) => response.json()),
      new Promise((resolve, reject) => { const image = new Image(); image.onload = resolve; image.onerror = reject; image.src = '/assets/cat-addon/generated/source-atlas.png'; sprite.style.backgroundImage = `url(${image.src})` })
    ]).then(([metadata]) => {
      data = metadata
      for (const item of data.tags) $('animation').add(new Option(`${item.name} (${item.frame_count}f)`, item.name))
      selectTag(data.tags[0].name)
    }).catch((error) => { status.textContent = `Studio failed to load: ${error}` })
    $('animation').onchange = (event) => selectTag(event.target.value)
    $('scene').onchange = (event) => { const name = event.target.value; $('scene-label').textContent = name === 'none' ? 'Raw animation preview' : `Final scene sequence: ${name}`; if (name === 'none') { sceneGeneration++; bounds.style.left = bounds.style.top = '50%' } else void runScene(name) }
    $('play').onclick = () => { playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play'; generation++; arm() }
    $('previous').onclick = () => { playing = false; $('play').textContent = 'Play'; generation++; frameCursor = (frameCursor - 1 + frameOrder(tag).length) % frameOrder(tag).length; arm() }
    $('next').onclick = () => { playing = false; $('play').textContent = 'Play'; generation++; frameCursor = (frameCursor + 1) % frameOrder(tag).length; arm() }
    $('cancel').onclick = () => { playing = false; generation++; sceneGeneration++; clearTimeout(timer); bounds.style.transition = ''; bounds.style.left = bounds.style.top = '50%'; sprite.style.visibility = 'hidden'; status.textContent = 'Playback cancelled safely'; setTimeout(() => { sprite.style.visibility = ''; render() }, 450) }
    $('scale').onchange = render; $('facing').onchange = render
    $('background').onchange = (event) => stage.classList.toggle('light', event.target.value === 'light')
    $('guides').onchange = (event) => stage.classList.toggle('guides', event.target.checked)
    $('clipping').onchange = (event) => stage.classList.toggle('clipped', event.target.checked)
  </script>
</body>
</html>
